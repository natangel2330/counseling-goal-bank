.container {

    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
}

h1 {
    margin-top: 0;

.select-grid {
    display: grid;

    margin-bottom: 20px;
}

select {

    border-radius: 8px;
    border: 1px solid #ccc;

.card {

.sessions { background:#fef3c7; }
.teacher { background:#cffafe; }
.parent { background:#fce7f3; }

ul {
    margin-top: 8px;
}

button {
    padding: 12px 20px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #1d4ed8;
}

.hidden {
    display:none;
}

.error {
    background:#fee2e2;
    padding:15px;
    border-radius:10px;
}
</style>

    <option>Intellectual Disability</option>

    <option>Coping Skills</option>
    <option>Self-Advocacy</option>
    <option selected>Anger Management</option>
    <option>Conflict Resolution</option>
    <option>Executive Functioning</option>
</select>

</div>

<button onclick="generate()">Generate</button>

<div id="output"></div>

</div>

function list(items){
    return "<ul>" + items.map(x => `<li>${x}</li>`).join("") + "</ul>";
}

function generate(){

    const grade = document.getElementById("grade").value;
    const disability = document.getElementById("disability").value;
    const need = document.getElementById("need").value;

    const result = data?.[grade]?.[disability]?.[need];

    const output = document.getElementById("output");

    if(!result){
        output.innerHTML =
        `<div class="error">
            No goal bank entry exists for this combination yet.
        </div>`;
        return;
    }

    output.innerHTML = `

    <div class="card goal">
        <h3>Annual Goal</h3>
        <p>${result.goal}</p>
    </div>

    <div class="card objectives">
        <h3>Objectives</h3>
        ${list(result.objectives)}
    </div>

    <div class="card progress">
        <h3>Progress Monitoring</h3>
        ${list(result.progress)}
    </div>

    <div class="card sessions">
        <h3>Session Ideas</h3>
        ${list(result.sessions)}
    </div>

    <div class="card teacher">
        <h3>Teacher Supports</h3>
        ${list(result.teacher)}
    </div>

    <div class="card parent">

    `;
}
