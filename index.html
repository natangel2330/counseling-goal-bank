<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
}

h1 {
    margin-top: 0;
}

.select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 15px;
    margin-bottom: 20px;
}

select {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.card {
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.goal { background:#dbeafe; }
.objectives { background:#dcfce7; }
.progress { background:#f3e8ff; }
.sessions { background:#fef3c7; }
.teacher { background:#cffafe; }
.parent { background:#fce7f3; }

ul {
    margin-top: 8px;
}

button {
    padding: 12px 20px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #1d4ed8;
}

.hidden {
    display:none;
}

.error {
    background:#fee2e2;
    padding:15px;
    border-radius:10px;
}
</style>
</head>

    <option>Self-Advocacy</option>
    <option selected>Anger Management</option>
    <option>Conflict Resolution</option>

</div>

<button onclick="generate()">Generate</button>

<div id="output"></div>

function list(items){
    return "<ul>" + items.map(x => `<li>${x}</li>`).join("") + "</ul>";
}

function generate(){

    const grade = document.getElementById("grade").value;
    const disability = document.getElementById("disability").value;
    const need = document.getElementById("need").value;

    const result = data?.[grade]?.[disability]?.[need];

    const output = document.getElementById("output");

    if(!result){
        output.innerHTML =
        `<div class="error">
            No goal bank entry exists for this combination yet.
        </div>`;
        return;
    }

    output.innerHTML = `

    <div class="card goal">
        <h3>Annual Goal</h3>
        <p>${result.goal}</p>
    </div>

    <div class="card objectives">
        <h3>Objectives</h3>
