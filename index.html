    border-radius: 20px;

.card {

}

button {

    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #1d4ed8;
}

.hidden {
    display:none;
}

.error {
    background:#fee2e2;
    padding:15px;
    border-radius:10px;

    <option>Emotional Regulation</option>
    <option>Coping Skills</option>
    <option>Self-Advocacy</option>
    <option selected>Anger Management</option>
    <option>Conflict Resolution</option>
    <option>Executive Functioning</option>
</select>

</div>

<button onclick="generate()">Generate</button>

<div id="output"></div>

function list(items){
    return "<ul>" + items.map(x => `<li>${x}</li>`).join("") + "</ul>";
}

function generate(){

    const grade = document.getElementById("grade").value;
    const disability = document.getElementById("disability").value;
    const need = document.getElementById("need").value;

    const result = data?.[grade]?.[disability]?.[need];

    const output = document.getElementById("output");

    if(!result){
        output.innerHTML =
        `<div class="error">
            No goal bank entry exists for this combination yet.
        </div>`;
        return;
    }

    output.innerHTML = `

    <div class="card goal">
        <h3>Annual Goal</h3>
        <p>${result.goal}</p>
    </div>

    <div class="card objectives">
        <h3>Objectives</h3>

    </div>
