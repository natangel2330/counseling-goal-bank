<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counseling Goal Bank Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
}

h1 {
    margin-top: 0;
}

.select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 15px;
    margin-bottom: 20px;
}

select {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.card {
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.goal { background:#dbeafe; }
.objectives { background:#dcfce7; }
.progress { background:#f3e8ff; }
.sessions { background:#fef3c7; }
.teacher { background:#cffafe; }
.parent { background:#fce7f3; }

ul {
    margin-top: 8px;
}

button {
    padding: 12px 20px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #1d4ed8;
}

.hidden {
    display:none;
}

.error {
    background:#fee2e2;
    padding:15px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Counseling Goal Bank Generator</h1>
<p>Select options and generate counseling goals and supports.</p>

<div class="select-grid">

<select id="grade">
    <option>Elementary</option>
    <option selected>Middle</option>
    <option>High</option>
</select>

<select id="disability">
    <option>General</option>
    <option selected>Autism</option>
    <option>OHI/ADHD</option>
    <option>Emotional Disability</option>
    <option>SLD</option>
    <option>Intellectual Disability</option>
    <option>OHI/Other</option>
</select>

<select id="need">
    <option>Anxiety</option>
    <option>Self-Esteem</option>
    <option>Friendship Skills</option>
    <option>Emotional Regulation</option>
    <option>Coping Skills</option>
    <option>Self-Advocacy</option>
    <option selected>Anger Management</option>
    <option>Conflict Resolution</option>
    <option>Executive Functioning</option>
</select>

</div>

<button onclick="generate()">Generate</button>

<div id="output"></div>

</div>

<script>

const data = {

    Autism: {
        Anxiety: {

            objectives: [
                "Identify feelings associated with anxiety.",
                "Use a visual coping tool.",
                "Request help appropriately."
            ],
            progress: [
                "Counselor data",
                "Teacher checklist",
                "Student rating scale"
            ],
            sessions: [
                "Feelings identification",
                "Calm-down toolbox",
                "Social stories"
            ],
            teacher: [
                "Provide visual supports",
                "Preview schedule changes",
                "Use calm prompts"
            ],
            parent: [
                "Practice coping skills at home",
                "Use consistent routines",
                "Reinforce self-advocacy"
            ]
        }
    },

    General: {
        Anxiety: {
            goal: "Student will use coping strategies to reduce anxiety-related behaviors in school settings.",
            objectives: [
                "Identify triggers",
                "Practice coping strategies",
                "Use strategies independently"
            ],
            progress: [
                "Teacher reports",
                "Behavior data",
                "Student self-monitoring"
            ],
            sessions: [
                "Deep breathing",
                "Worry management",
                "Relaxation activities"
            ],
            teacher: [
                "Provide reassurance",
                "Teach coping reminders",
                "Allow breaks when needed"
            ],
            parent: [
                "Discuss worries",
                "Practice coping skills",
                "Encourage problem solving"
            ]
        }
    }

},

Middle: {

    Autism: {
        "Friendship Skills": {
            goal: "Student will demonstrate age-appropriate friendship skills across school settings in 4 of 5 observed opportunities.",
            objectives: [
                "Initiate conversations",
                "Maintain reciprocal exchanges",
                "Demonstrate perspective taking"
            ],
            progress: [
                "Social skills rubric",
                "Teacher observation",
                "Counselor observation"
            ],
            sessions: [
                "Conversation practice",
                "Role-playing",
                "Perspective-taking activities"
            ],
            teacher: [
                "Facilitate structured peer interaction",
                "Provide feedback",
                "Identify peer supports"
            ],
            parent: [
                "Arrange social opportunities",
                "Practice conversation skills",
                "Discuss friendship expectations"
            ]
        }
    },

    General: {
        "Self-Esteem": {
            goal: "Student will demonstrate improved self-confidence and positive self-perception in 4 of 5 opportunities.",
            objectives: [
                "Identify strengths",
                "Use positive self-talk",
                "Complete challenging tasks"
            ],
            progress: [
                "Self-rating scale",
                "Teacher input",
                "Counselor notes"
            ],
            sessions: [
                "Strength inventory",
                "Growth mindset activities",
                "Success reflections"
            ],
            teacher: [
                "Provide positive feedback",
                "Highlight strengths",
                "Support risk taking"
            ],
            parent: [
                "Celebrate progress",
                "Encourage independence",
                "Model positive self-talk"
            ]
        }
    }

},
    
        "Anger Management": {

    goal: "Student will demonstrate improved anger management skills by using appropriate coping and problem-solving strategies to respond to frustration, conflict, and perceived provocation in 4 of 5 documented opportunities.",

    objectives: [
        "Identify personal triggers that contribute to feelings of anger or frustration.",
        "Demonstrate at least three coping strategies when experiencing anger.",
        "Use appropriate communication and problem-solving skills instead of verbal or physical aggression."
    ],

    progress: [
        "Counselor observation and session data",
        "Teacher behavior rating forms",
        "Behavior incident tracking",
        "Student self-monitoring logs"
    ],

    sessions: [
        "Identifying anger triggers",
        "Coping skills toolbox development",
        "Deep breathing and relaxation training",
        "Perspective-taking exercises",
        "Conflict resolution role-play activities",
        "Problem-solving practice",
        "Using I-Statements",
        "Impulse control activities"
    ],

    teacher: [
        "Provide pre-correction before challenging situations.",
        "Reinforce appropriate use of coping skills.",
        "Allow opportunities for cool-down breaks when needed.",
        "Use calm, neutral redirection during escalation.",
        "Recognize and praise successful emotional regulation."
    ],

    parent: [
        "Practice coping skills at home.",
        "Model calm problem-solving strategies.",
        "Discuss triggers and appropriate responses.",
        "Provide praise when frustration is managed appropriately.",
        "Maintain consistent expectations and consequences."
    ]
},
    
High: {

    General: {
        Anxiety: {
            goal: "Student will independently manage anxiety using learned coping strategies in academic and social settings.",
            objectives: [
                "Recognize early warning signs",
                "Apply coping strategies",
                "Advocate for needed supports"
            ],
            progress: [
                "Self-monitoring logs",
                "Teacher feedback",
                "Counselor review"
            ],
            sessions: [
                "Stress management",
                "Cognitive restructuring",
                "Self-advocacy training"
            ],
            teacher: [
                "Offer check-ins",
                "Provide organizational support",
                "Reduce unnecessary stressors"
            ],
            parent: [
                "Support planning",
                "Discuss coping skills",
                "Monitor stress levels"
            ]
        }
    }

}
};

function list(items){
    return "<ul>" + items.map(x => `<li>${x}</li>`).join("") + "</ul>";
}

function generate(){

    const grade = document.getElementById("grade").value;
    const disability = document.getElementById("disability").value;
    const need = document.getElementById("need").value;

    const result = data?.[grade]?.[disability]?.[need];

    const output = document.getElementById("output");

    if(!result){
        output.innerHTML =
        `<div class="error">
            No goal bank entry exists for this combination yet.
        </div>`;
        return;
    }

    output.innerHTML = `

    <div class="card goal">
        <h3>Annual Goal</h3>
        <p>${result.goal}</p>
    </div>

    <div class="card objectives">
        <h3>Objectives</h3>
        ${list(result.objectives)}
    </div>

    <div class="card progress">
        <h3>Progress Monitoring</h3>
        ${list(result.progress)}
    </div>

    <div class="card sessions">
        <h3>Session Ideas</h3>
        ${list(result.sessions)}
    </div>

    <div class="card teacher">
        <h3>Teacher Supports</h3>
        ${list(result.teacher)}
    </div>

    <div class="card parent">
        <h3>Parent Supports</h3>
        ${list(result.parent)}
    </div>

    `;
}

generate();

</script>

</body>
</html>
