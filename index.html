function list(items){
    return "<ul>" + items.map(x => `<li>${x}</li>`).join("") + "</ul>";
}

function generate(){

    const grade = document.getElementById("grade").value;
    const disability = document.getElementById("disability").value;
    const need = document.getElementById("need").value;

    const result = data?.[grade]?.[disability]?.[need];

    const output = document.getElementById("output");

    if(!result){
        output.innerHTML =
        `<div class="error">
            No goal bank entry exists for this combination yet.
        </div>`;
        return;
    }

    output.innerHTML = `

    <div class="card goal">
        <h3>Annual Goal</h3>
        <p>${result.goal}</p>
    </div>

    <div class="card objectives">
        <h3>Objectives</h3>
        ${list(result.objectives)}
    </div>

    <div class="card progress">
        <h3>Progress Monitoring</h3>
        ${list(result.progress)}
    </div>

    <div class="card sessions">
        <h3>Session Ideas</h3>
        ${list(result.sessions)}
    </div>

    <div class="card teacher">
        <h3>Teacher Supports</h3>
        ${list(result.teacher)}
    </div>

    <div class="card parent">
        <h3>Parent Supports</h3>
        ${list(result.parent)}
    </div>

    `;
}

generate();

</script>
